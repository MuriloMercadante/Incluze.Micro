# Profile de producao - Azure SQL Database
# Todas as credenciais vem de variaveis de ambiente (nunca versionar senhas).
spring.datasource.url=jdbc:sqlserver://${DB_SERVER_URL}:${DB_SERVER_PORT:1433};databaseName=${DB_SCHEMA};encrypt=true;trustServerCertificate=false;hostNameInCertificate=*.database.windows.net;loginTimeout=30
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PWD}

spring.jpa.show-sql=false

spring.application.name=incluze-api
server.port=8080
spring.profiles.default=dev

# Versionamento das rotas: api/v1/...
api.version=v1

# Swagger UI na rota raiz "/"
springdoc.swagger-ui.path=/
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

# SQL Server
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# Pool de conexoes: o Azure SQL serverless pausa quando ocioso e leva alguns
# segundos para retomar. O pool aguarda (em vez de falhar com 500) e, na
# inicializacao, espera o banco acordar antes de desistir.
spring.datasource.hikari.connection-timeout=60000
spring.datasource.hikari.initialization-fail-timeout=180000
spring.datasource.hikari.maximum-pool-size=5

# Schema versionado (src/main/resources/db/schema.sql), idempotente,
# executado a cada inicializacao. O Hibernate apenas valida o mapeamento.
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/schema.sql
spring.sql.init.continue-on-error=false

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Nunca expor detalhes internos nas respostas de erro
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-exception=false

server.forward-headers-strategy=framework

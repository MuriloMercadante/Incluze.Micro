# Profile de desenvolvimento - SQL Server local (ex.: container Docker)
# Quando a API esta em um container e o SQL Server esta no host,
# use host.docker.internal como DB_SERVER_URL.
spring.datasource.url=jdbc:sqlserver://${DB_SERVER_URL:localhost}:${DB_SERVER_PORT:1433};databaseName=${DB_SCHEMA:aether};encrypt=false;trustServerCertificate=true
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PWD}

spring.jpa.show-sql=true
